[project]
name = "ygosim"
version = "0.1.0"
description = "Yu-Gi-Oh! meta simulation and deck optimization"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.scripts]
ygosim = "ygosim.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ygosim"]
